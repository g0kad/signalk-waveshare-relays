# Publishes the plugin to npm, which is where the Signal K App Store finds it.
# Triggered by pushing a tag like v0.2.0 that matches package.json.
#
# Uses npm trusted publishing (OIDC), so no npm token is stored in GitHub.
# The very first version has to be published by hand; after that, add this
# workflow as a trusted publisher in the package's settings on npmjs.com.
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Check whether this version is already on npm
        id: published
        run: |
          if npm view "$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "::notice::$GITHUB_REF_NAME is already on npm, nothing to publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.exists != 'true'
        run: npm install --no-audit --no-fund
      - if: steps.published.outputs.exists != 'true'
        run: npm test
      # Trusted publishing needs npm 11.5.1 or newer
      - if: steps.published.outputs.exists != 'true'
        run: npm install -g npm@latest
      - if: steps.published.outputs.exists != 'true'
        run: npm publish --access public
