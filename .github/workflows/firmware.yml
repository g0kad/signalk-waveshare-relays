# Builds the prebuilt ESPHome firmware.
#
# Pull requests and pushes to main that touch firmware/ only check that it
# compiles. Pushing a tag like firmware-v0.3.0 also attaches the binaries to a
# GitHub release and publishes the browser installer on GitHub Pages
# (Settings -> Pages -> Source: GitHub Actions).
name: Firmware

on:
  push:
    branches: [main]
    paths: ['firmware/**', '.github/workflows/firmware.yml']
    tags: ['firmware-v*']
  pull_request:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  ESPHOME_VERSION: 2026.8.1
  CONFIG: firmware/waveshare-relays.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Read firmware version
        id: version
        run: |
          versions=$(grep -E '^\s+version: "[^"]+"' "$CONFIG" | sed -E 's/.*"(.*)"/\1/' | sort -u)
          if [ "$(echo "$versions" | wc -l)" != 1 ]; then
            echo "::error::The version numbers in $CONFIG differ: $versions"
            exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/firmware-v* && "$GITHUB_REF_NAME" != "firmware-v$versions" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match firmware version $versions"
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ env.ESPHOME_VERSION }}
      - run: pip install "esphome==$ESPHOME_VERSION"
      - run: esphome compile "$CONFIG"

      - name: Collect binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          factory=$(find firmware/.esphome/build -name firmware.factory.bin | head -n1)
          ota=$(find firmware/.esphome/build -name firmware.ota.bin | head -n1)
          cp "$factory" "out/waveshare-relays-$VERSION.factory.bin"
          cp "$ota" "out/waveshare-relays-$VERSION.ota.bin"
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/firmware-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: firmware
          path: out
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Firmware $VERSION" \
            --notes "Prebuilt ESPHome firmware for the Waveshare ESP32-S3-ETH-8DI-8RO.

          - **New board:** flash it from the browser installer at https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/
          - **Board already running this firmware:** open its web page, and upload \`waveshare-relays-$VERSION.ota.bin\` under OTA Update."

  pages:
    if: startsWith(github.ref, 'refs/tags/firmware-v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: firmware
          path: site/firmware
      - name: Build installer site
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cp firmware/installer/index.html site/
          sed -i "s/{{VERSION}}/$VERSION/g" site/index.html
          cat > site/manifest.json <<JSON
          {
            "name": "Waveshare Relays for Signal K",
            "version": "$VERSION",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [{ "path": "firmware/waveshare-relays-$VERSION.factory.bin", "offset": 0 }]
              }
            ]
          }
          JSON
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
